// Gradle 9 requires a JVM between 17 and 26 to run, so no explicit Java version check is needed
// here; Gradle itself reports a clear error on an unsupported JVM.

plugins {
  // build.gradle sets `java.toolchain.languageVersion` to 21.  Without a toolchain resolver, the
  // build fails on a machine that has no JDK 21 installed -- such as a continuous integration job
  // whose only JDK is the one it runs Gradle under.  This plugin downloads a JDK when none is
  // found.  Settings plugins cannot read gradle/libs.versions.toml, so the version appears here.
  id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}

// Project name is read-only in build scripts, and defaults to directory name.
rootProject.name = "bcel-util"
