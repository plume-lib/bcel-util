name: Java CI with Gradle

"on": [push, pull_request]

jobs:

  # Formatting does not depend on the Java version, so Spotless runs in this single job rather than
  # in every job of the "build" matrix below.  Spotless's Groovy-Eclipse formatter downloads about
  # 140MB from Eclipse P2 repositories, and that download fails often enough that performing it once
  # per push rather than once per matrix job noticeably reduces "Failed to provision P2 dependencies"
  # errors.
  spotless:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true
          cache: 'gradle'
      # Key the cache on just the two versions that determine its contents, rather than on a hash of
      # all of gradle/libs.versions.toml.  A hash of the whole file changes whenever any dependency
      # is upgraded, which would make the cache go cold far more often than the formatter actually
      # changes; the usual remedy for that, "restore-keys", makes the cache grow without bound,
      # because each save then writes back every formatter version that an earlier run downloaded.
      - name: Compute the Spotless P2 cache key
        id: spotless-p2-key
        run: |
          set -eu
          greclipse="$(sed -n 's/^greclipse *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)"
          spotless="$(sed -n 's/^com-diffplug-spotless *=.*version *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)"
          if [ -z "$greclipse" ] || [ -z "$spotless" ]; then
            echo "Cannot read the Groovy-Eclipse and Spotless versions from gradle/libs.versions.toml" >&2
            exit 1
          fi
          echo "key=spotless-p2-${{ runner.os }}-greclipse-$greclipse-spotless-$spotless" >> "$GITHUB_OUTPUT"
      # The directory is the one that build.gradle passes to `greclipseConfig.cacheDirectory`.  It
      # holds the P2 metadata and every downloaded bundle, so a cache hit means that the Spotless
      # run below makes no network requests to the P2 repositories.
      - name: Restore Spotless P2 cache
        id: restore-spotless-p2
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/spotless-p2
          key: ${{ steps.spotless-p2-key.outputs.key }}
          restore-keys: ${{ steps.spotless-p2-key.outputs.key }}-partial-
      # Solstice, which provisions the cache for Spotless, guards it with a lock file, and never
      # checks whether the process that the lock file names still exists.  A run that is killed
      # while provisioning -- by a job that times out, for instance -- leaves the lock file behind,
      # and a partial cache entry can therefore carry one.  Every later run that restored it would
      # wait for the timeout and then fail with "Failed to provision P2 dependencies".  Nothing on
      # this freshly created runner can hold the lock, so delete the file unconditionally.
      - name: Delete any restored Spotless P2 lock file
        run: rm -f ~/.gradle/spotless-p2/metadata/.lock
      - name: ./gradlew spotlessCheck
        id: spotless-check
        run: |
          set -o pipefail
          p2_dir=~/.gradle/spotless-p2
          # How much of the formatter the cache directory holds:  the total size of its files, or 0
          # if it does not exist.  Comparing this before and after the attempts below tells the step
          # at the end of this job whether this run downloaded anything that the cache does not
          # already hold.
          #
          # "|| true" keeps a nonexistent directory, which is what "find" fails on, from aborting
          # this step:  GitHub runs the script under "bash -e", and the "set -o pipefail" above
          # would otherwise propagate that failure out of the pipeline.
          p2_size() {
            find "$p2_dir" -type f -printf '%s\n' 2>/dev/null \
              | awk '{ total += $1 } END { print total + 0 }' \
              || true
          }
          size_before="$(p2_size)"
          for attempt in 1 2 3; do
            if ./gradlew spotlessCheck --stacktrace 2>&1 | tee "$RUNNER_TEMP/spotless-output.txt"; then
              exit 0
            fi
            if ! grep -q 'Failed to provision P2 dependencies' "$RUNNER_TEMP/spotless-output.txt"; then
              # The failure is a formatting violation or some other real problem, not a failure to
              # download the Groovy-Eclipse formatter.  Retrying would not help.  Break rather than
              # exit, so that whatever an earlier attempt downloaded still gets measured below.
              break
            fi
            sleep $((30 * attempt))
          done
          size_after="$(p2_size)"
          if [ "$size_after" -gt "$size_before" ]; then
            echo "downloaded_more=true" >> "$GITHUB_OUTPUT"
          fi
          exit 1
      # A cache that a successful run saves is complete, so later runs can use it without any
      # network access.  Saving is skipped after an exact cache hit, because a cache entry that
      # exists cannot be overwritten.
      - name: Save the complete Spotless P2 cache
        if: success() && steps.restore-spotless-p2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/spotless-p2
          key: ${{ steps.spotless-p2-key.outputs.key }}
      # A failing run usually downloaded part of the formatter -- or even all of it, if what failed
      # was the formatting check rather than the download -- and caching that makes the next run
      # more likely to succeed.  The key differs from the one above so that a partial cache can
      # never masquerade as a complete one:  it is reachable only through "restore-keys", and the
      # next successful run supersedes it.
      #
      # Nothing is saved unless the step above downloaded more of the formatter than the restore
      # supplied, and unless the restore missed.  A run that downloaded nothing new has nothing to
      # contribute, and an exact cache hit cannot be overwritten anyway.  Without those conditions,
      # every failure would write another ~140MB entry.  Entries are evicted least-recently-used
      # once a repository holds 10GB of them, so needless entries push out the Gradle caches that
      # "setup-java" maintains.
      - name: Save a partial Spotless P2 cache
        if: failure() && steps.spotless-check.outputs.downloaded_more == 'true' && steps.restore-spotless-p2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/spotless-p2
          key: ${{ steps.spotless-p2-key.outputs.key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: ['17', '21', '25', '26']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            ${{ matrix.java }}
            21
          check-latest: true
          cache: 'gradle'
      # "setup-java" puts the last of the JDKs above on the PATH, so plain `java -version` would
      # report Java 21 in every job of the matrix.  Name the JDK that the tests run under instead.
      - name: java -version
        run: |
          "${JAVA_HOME_${{ matrix.java }}_${{ runner.arch }}}/bin/java" -version
      # Gradle does not auto-detect the JDKs that "setup-java" installs, because
      # they are in the tool cache rather than in a standard location.
      # The "spotless" job above performs the formatting checks.
      - name: ./gradlew build
        run: ./gradlew build -x spotlessCheck -PtestJavaVersion=${{ matrix.java }} -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_${{ runner.arch }},JAVA_HOME_21_${{ runner.arch }}
